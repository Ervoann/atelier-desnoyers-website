<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Administration - Atelier Desnoyers</title>
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'Ervoann/atelier-desnoyers-website',
          branch: 'main'
        },
        media_folder: 'public/uploads',
        public_folder: '/uploads',
        locale: 'fr',
        collections: [
          {
            name: 'settings',
            label: 'Paramètres du site',
            files: [
              {
                name: 'homepage',
                label: "Page d'accueil",
                file: 'public/content/settings/homepage.json',
                fields: [
                  { label: 'Titre du site', name: 'siteTitle', widget: 'string' },
                  { label: 'Sous-titre', name: 'subtitle', widget: 'string' },
                  { label: 'Image de bannière', name: 'bannerImage', widget: 'image' },
                  { label: 'Description', name: 'description', widget: 'text' }
                ]
              },
              {
                name: 'general',
                label: 'Paramètres généraux',
                file: 'public/content/settings/general.json',
                fields: [
                  { label: "Nom de l'atelier", name: 'atelierName', widget: 'string' },
                  { label: 'Email de contact', name: 'email', widget: 'string' }
                ]
              }
            ]
          },
          {
            name: 'blog',
            label: 'Articles de blog',
            folder: 'public/content/blog',
            create: true,
            slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
            fields: [
              { label: 'Titre', name: 'title', widget: 'string' },
              { label: 'Date de publication', name: 'date', widget: 'datetime' },
              { label: 'Auteur', name: 'author', widget: 'string', default: 'Atelier Desnoyers' },
              { label: 'Image de couverture', name: 'coverImage', widget: 'image' },
              { label: 'Contenu', name: 'body', widget: 'markdown' },
              { label: 'Publié', name: 'published', widget: 'boolean', default: true }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
